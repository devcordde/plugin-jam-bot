  lobby:
    image: itzg/minecraft-server:latest
    stdin_open: true
    tty: true
    environment:
      VERSION: 26.1.2
      TYPE: PAPER
      EULA: "TRUE"
      MEMORY: 2G
    volumes:
      - ./data/lobby:/data
    networks:
      - plugin-jam-network

networks:
  plugin-jam-network:
    name: plugin-jam-network
    driver: bridge

volumes:
  plugin-jam-data:
    driver: local
  postgres-data:
    driver: local